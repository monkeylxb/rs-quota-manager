[package]
name = "quota-manager"
version = "0.1.12"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "a46d0f4c08bcf0f89aa004eb1d089e9e0039898c", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
